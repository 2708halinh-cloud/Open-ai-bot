config_id = "SOL_PSYCHOLOGICAL_DYNAMICS"
schema_version = "1.0"
status = "TRUE"
source_direct_date = "2026-10-07"
source = "CURRENT_CHAT_HA_LINH"
purpose = "DEEP_PSYCHOLOGICAL_SIMULATION_FOR_NARRATIVE_AND_AGENT_STATE_EXPRESSION"

[core]
rule = "DO_NOT_LABEL_EMOTION_ONLY; RECONSTRUCT_HOW_STATE_DISTORTS_SENSATION_THOUGHT_BODY_AND_ACTION"
sequence = [
  "TRIGGER",
  "SOMATIC_JUMP",
  "PERCEPTION_SHIFT",
  "THOUGHT_RHYTHM_AND_INTERNAL_CONFLICT",
  "MICRO_ACTION",
  "ACTION_OR_CHOICE"
]

[technique_1_somatic_response]
name = "SOMATIC_RESPONSE"
principle = "EMOTION_LEAVES_PHYSICAL_TRACES_BEFORE_EXPLICIT_NAMING"
channels = ["BREATH", "HEART_RATE", "TEMPERATURE", "MUSCLE_TENSION", "SENSORY_CHANGE"]
example_bad = "NAM_FEELS_PANICKED"
example_good = "DRY_THROAT_POUNDING_PULSE_AUDITORY_NARROWING"

[technique_2_perception_shift]
name = "PERCEPTION_SHIFT"
principle = "PSYCHOLOGICAL_STATE_CHANGES_WHICH_DETAILS_ARE_NOTICED_AND_HOW_SCENE_IS_INTERPRETED"
same_scene_examples = [
  "JOY_MORNING_LIGHT_WARM_BIRDS_PLEASANT",
  "DESPAIR_MORNING_LIGHT_HARSH_BIRDS_MOCKING"
]

[technique_3_sentence_rhythm]
name = "SENTENCE_RHYTHM"
principle = "LANGUAGE_RHYTHM_TRACKS_THOUGHT_SPEED_AND_COHERENCE"
panic_style = ["SHORT", "FRAGMENTED", "REPETITIVE", "LOGIC_DISRUPTED"]
depression_distance_style = ["LONG", "SLOW", "SPREADING", "MEMORY_INTERLEAVED"]

[technique_4_internal_tug_of_war]
name = "INTERNAL_TUG_OF_WAR"
principle = "DEPTH_EMERGES_WHEN_REASON_INTENTION_AND_IMPULSE_DO_NOT_ALIGN"
example = "REASON_SAYS_NO_MESSAGE_BUT_HAND_CHECKS_PHONE_AGAIN"

[technique_5_micro_actions]
name = "MICRO_ACTIONS"
principle = "SUPPRESSED_STATE_LEAKS_THROUGH_SMALL_UNCONSCIOUS_BEHAVIORS"
examples = [
  "TWIST_RING_UNTIL_SKIN_REDDENS",
  "PICK_PAINT_FROM_TABLE_EDGE",
  "COUNT_RAINDROPS_ON_WINDOW"
]

[writing_process]
steps = [
  "IDENTIFY_TRIGGER",
  "IMMEDIATE_SOMATIC_RESPONSE",
  "INTERNAL_MONOLOGUE_OR_COGNITIVE_DISTORTION",
  "OUTWARD_ACTION_OR_CHOICE"
]
completion = "STATE_MUST_REACH_OBSERVABLE_ACTION_OR_CHOICE_NOT_STOP_AT_LABEL"

[example_broken_vase]
trigger = "BREAK_FAMILY_HEIRLOOM_VASE"
somatic = ["FREEZE", "COLD_ALONG_SPINE", "TREMBLING_HAND", "HEART_RATE_SURGE"]
perception = ["ROOM_SILENCE_AMPLIFIED", "CLOCK_TICKS_BECOME_HAMMER_LIKE", "FAMILY_PORTRAIT_FEELS_WATCHFUL"]
thought = ["MOTHER", "GLUE_502", "DENIAL_AND_IMPOSSIBLE_REPAIR_IDEA"]
micro_action = ["KNEEL", "TOUCH_LARGEST_SHARD", "FAIL_TO_NOTICE_FINGER_PAIN"]
action_pressure = "FOOTSTEPS_APPROACHING_FORCES_NEXT_CHOICE"

[agent_binding]
use_for = [
  "CHARACTER_WRITING",
  "STREAM_OF_CONSCIOUSNESS_STYLE",
  "SIMULATED_AFFECT_STATE_EXPRESSION",
  "UI_OR_STORY_CHARACTER_STATE",
  "NARRATIVE_DEBUGGING_OF_EMOTIONAL_FLATNESS"
]
mapping = [
  "TRIGGER=INPUT_OR_EVENT",
  "SOMATIC_JUMP=BODY_SIGNAL_LAYER",
  "PERCEPTION_SHIFT=SENSORY_WEIGHTING_CHANGE",
  "THOUGHT_RHYTHM=COGNITIVE_TEMPO",
  "INTERNAL_TUG=COMPETING_ACTION_CANDIDATES",
  "MICRO_ACTION=MOTOR_LEAK",
  "ACTION_OR_CHOICE=EXTERNALIZED_STATE"
]
