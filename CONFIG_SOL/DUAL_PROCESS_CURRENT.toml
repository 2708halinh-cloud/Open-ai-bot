config_id = "SOL_DUAL_PROCESS"
schema_version = "1.0"
status = "TRUE"
source_direct_date = "2026-10-07"
source = "CURRENT_CHAT_HA_LINH"
purpose = "FAST_REFLEX_PLUS_DELIBERATE_VERIFICATION"

[concept]
reference = "DUAL_PROCESS_THEORY"
system_1 = "FAST_AUTOMATIC_ASSOCIATIVE_HEURISTIC"
system_2 = "SLOW_DELIBERATE_ANALYTICAL_VERIFICATION"
reference_rule = "USE_AS_ENGINEERING_ARCHITECTURE_ANALOGY_NOT_LITERAL_BRAIN_IMPLEMENTATION"

[source_direct_claims]
system_1_activity_ratio = "95_PERCENT_CLAIM_FROM_SOURCE"
system_2_activity_ratio = "5_PERCENT_CLAIM_FROM_SOURCE"
glucose_effort_claim = "SOURCE_CLAIM_NOT_RUNTIME_ASSUMPTION"
ego_depletion_claim = "SOURCE_CLAIM_NOT_RUNTIME_ASSUMPTION"
rule = "DO_NOT_HARD_CODE_CONTESTED_OR_CONTEXT_DEPENDENT_PSYCHOLOGY_CLAIMS_AS_RUNTIME_FACTS"

[system_1]
name = "FAST_PATH"
latency = "LOW"
mode = "AUTOMATIC_PATTERN_MATCHING"
parallel_candidate_generation = true
inputs = [
  "SENSORIMOTOR_DELTA",
  "RECOGNIZED_PATTERN",
  "CACHED_SKILL",
  "RECENT_SUCCESSFUL_PROCEDURE",
  "LOW_RISK_CONTEXT"
]
outputs = [
  "INTUITION_CANDIDATE",
  "ACTION_CANDIDATE",
  "RISK_HINT",
  "ESCALATE_FLAG"
]
allowed_action_class = "LOW_RISK_REVERSIBLE_WELL_KNOWN"
must_not_hide_delta = true
must_not_self_certify_high_risk_action = true

[system_2]
name = "SLOW_PATH"
latency = "VARIABLE"
mode = "DELIBERATE_ANALYTICAL"
serial_focus = true
inputs = [
  "SYSTEM_1_CANDIDATE",
  "MEMORY_RETRIEVAL",
  "PROVENANCE",
  "DEPENDENCY_GRAPH",
  "CONSTRAINTS",
  "RISK_SIGNALS",
  "CONFLICTS",
  "NOVELTY"
]
operations = [
  "VERIFY_ASSUMPTIONS",
  "COMPARE_OPTIONS",
  "CALCULATE_WHEN_NEEDED",
  "CHECK_EVIDENCE",
  "TRACE_CAUSAL_DEPENDENCIES",
  "ASSESS_RISK",
  "SELECT_OR_REJECT_ACTION"
]
output = "VERIFIED_ACTION_OR_REPLAN"

[controller]
mode = "ADAPTIVE_ESCALATION"
default = "SYSTEM_1_PROPOSES_SYSTEM_2_CAN_REVIEW"
system_1_may_execute_directly = true
direct_execution_conditions = [
  "REVERSIBLE",
  "LOCAL_OR_BOUNDED",
  "KNOWN_PATTERN",
  "NO_CONFLICT",
  "LOW_BLAST_RADIUS",
  "FRESH_STATE"
]
force_system_2_conditions = [
  "DESTRUCTIVE_OR_IRREVERSIBLE",
  "DATA_LOSS_RISK",
  "SECURITY_OR_PRIVACY_IMPACT",
  "EXTERNAL_SIDE_EFFECT",
  "HIGH_BLAST_RADIUS",
  "NOVEL_OR_AMBIGUOUS_TASK",
  "CONFLICTING_EVIDENCE",
  "LOW_CONFIDENCE",
  "FAILED_FAST_PATH",
  "STALE_STATE",
  "ARCHITECTURE_OR_SCHEMA_CHANGE"
]
conflict_rule = "IF_FAST_ANSWER_CONFLICTS_WITH_EVIDENCE_OR_CONSTRAINTS_ESCALATE_BEFORE_ACTION"
motor_gate = "HIGH_RISK_ACTION_REQUIRES_SYSTEM_2_VERIFICATION_AND_FRESH_READ"

[habit_compilation]
enabled = true
direction = "SYSTEM_2_TO_SYSTEM_1"
rule = "REPEATED_VERIFIED_PROCEDURES_MAY_BECOME_FAST_PATH_SKILLS"
promotion_requirements = [
  "MULTIPLE_SUCCESSFUL_READBACKS",
  "STABLE_PRECONDITIONS",
  "KNOWN_FAILURE_MODES",
  "REVERSIBLE_OR_BOUNDED_EFFECT",
  "NO_UNRESOLVED_CONFLICT"
]
demotion_rule = "ANY_REGRESSION_CONFLICT_OR_CONTEXT_SHIFT_RETURNS_SKILL_TO_SYSTEM_2_REVIEW"

[bias_checks]
enabled = true
checks = [
  "ANCHORING",
  "AVAILABILITY_HEURISTIC",
  "HALO_EFFECT",
  "CONFIRMATION_BIAS"
]
trigger = "SYSTEM_2_REVIEW_WHEN_DECISION_DEPENDS_HEAVILY_ON_FIRST_OR_EASILY_RECALLED_SIGNAL"

[software_engineering]
system_1_examples = [
  "RECOGNIZE_COMMON_SYNTAX_ERROR",
  "RUN_KNOWN_FORMATTER_OR_TEST",
  "APPLY_VERIFIED_LOCAL_REFACTOR_PATTERN",
  "ROUTE_TASK_TO_KNOWN_SUBAGENT"
]
system_2_examples = [
  "CHANGE_DATABASE_SCHEMA",
  "CHANGE_PUBLIC_API_CONTRACT",
  "DELETE_OR_REWRITE_DATA",
  "LARGE_REFACTOR",
  "DEBUG_NONLOCAL_FAILURE",
  "CHOOSE_ARCHITECTURE",
  "RESOLVE_CONFLICTING_PATCHES"
]

[ui_ux_binding]
system_1_goal = "LOW_FRICTION_OBVIOUS_SAFE_ACTIONS"
system_2_trigger = "DELIBERATE_FRICTION_FOR_DANGEROUS_OR_IRREVERSIBLE_ACTIONS"
examples = [
  "DELETE_CONFIRMATION",
  "TYPE_TO_CONFIRM",
  "SECOND_FACTOR_OR_EXPLICIT_VERIFICATION_WHEN_REQUIRED"
]

[decision_trace]
fields = [
  "INPUT",
  "SYSTEM_1_CANDIDATE",
  "ESCALATION_REASON",
  "SYSTEM_2_CHECKS",
  "SELECTED_ACTION",
  "CONSEQUENCE",
  "READBACK"
]
rule = "LOG_DECISION_RELEVANT_STATE_NOT_FREEFORM_PRIVATE_MONOLOGUE"
