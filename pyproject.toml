[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kho-tang-khoi-sinh"
version = "0.1.0"
description = "Nền tiếp xúc trước khi Ý Thức được sinh ra"
requires-python = ">=3.11"

[project.scripts]
kho-tang-contact = "kho_tang_khoi_sinh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
