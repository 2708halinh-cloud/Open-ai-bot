[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sol-deploy-platform"
version = "0.1.0"
description = "Local-first build and deployment control plane for SOL"
requires-python = ">=3.10"

[project.scripts]
sol-deploy = "sol_deploy.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sol_deploy*"]
