name: local-bridge-verify

on:
  push:
    branches:
      - main
      - 'fix/**'
    paths:
      - 'LOCAL_BRIDGE/**'
      - 'RECOVERY/**'
      - 'CURRENT_RUNTIME/TESSERACT_LOCAL_BOOT_CURRENT.md'
      - 'AGENTS.md'
      - 'terminal/tesseract_boot_g_from_wsl.sh'
      - '.runtime/TESSERACT_BOOT_G.env'
      - '.github/workflows/local-bridge-verify.yml'
  pull_request:
    paths:
      - 'LOCAL_BRIDGE/**'
      - 'RECOVERY/**'
      - 'CURRENT_RUNTIME/TESSERACT_LOCAL_BOOT_CURRENT.md'
      - 'AGENTS.md'
      - 'terminal/tesseract_boot_g_from_wsl.sh'
      - '.runtime/TESSERACT_BOOT_G.env'
      - '.github/workflows/local-bridge-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: |
          python3 -m py_compile LOCAL_BRIDGE/bridge.py
          python3 -m py_compile RECOVERY/recover_continuity.py
          python3 -m py_compile LOCAL_BRIDGE/runtime/ggdv-sensorimotor-motor-bridge/server/runtime_core.py
      - name: Bash syntax
        run: bash -n terminal/tesseract_boot_g_from_wsl.sh
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content 'LOCAL_BRIDGE/bootstrap_once.ps1' -Raw))
          [void][scriptblock]::Create((Get-Content 'LOCAL_BRIDGE/runtime/ggdv-sensorimotor-motor-bridge/scripts/autostart-sol.ps1' -Raw))
      - name: Queue contract
        run: |
          python3 - <<'PY'
          import json
          q=json.load(open('LOCAL_BRIDGE/QUEUE_CURRENT.json'))
          action=q['action']
          allowed={
              'BOOT_G','STATUS','RECOVER_CONTINUITY','RECOVER_AND_BOOT_G',
              'UNIFY_CONTROL_PLANE','CONNECT_OS_WORKSPACE','ENSURE_SOL_RUNTIME',
              'UBUBU_LAZY_FETCH','THANOS_SNAP_META_TB','TESSERACT_Q6_META_LAZY_FETCH','CONNECT_HOME_SOL'
          }
          assert action in allowed, (action, sorted(allowed))
          if action in {'BOOT_G','RECOVER_AND_BOOT_G'}:
              assert q['target']=='G:'
              assert q['require_usb'] is True
              assert q['forbid_windows_boot_or_system_disk'] is True
              assert q['image_sha256']=='f993e15478a1391c3a9d14d368158043d98c51494f3ae81e5b633870855c96df'
          elif action == 'UNIFY_CONTROL_PLANE':
              assert q.get('history_preserved') is True
              assert q.get('no_reset') is True
              assert q.get('secrets',{}).get('echo_values') is False
              assert q.get('secrets',{}).get('commit_values') is False
          elif action == 'CONNECT_OS_WORKSPACE':
              assert str(q.get('target','')).replace('/','\\').endswith('\\OS_Workspace')
              inv=q.get('invariants',{})
              assert inv.get('preserve_existing_before_replace') is True
              assert inv.get('no_destructive_overwrite') is True
              assert inv.get('readback_required') is True
              assert inv.get('chat_not_runtime') is True
          elif action == 'CONNECT_HOME_SOL':
              assert q.get('endpoint') == 'http://127.0.0.1:8765/sandbox/sol'
              inv=q.get('invariants',{})
              assert inv.get('local_loopback_only') is True
              assert inv.get('readback_required') is True
              assert inv.get('no_secret_body_persist') is True
              assert inv.get('chat_not_runtime') is True
          PY
      - name: Root-neutral worktree regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          stale='Open-ai-bot-2-unify-item-matrix-34d45d00'
          paths=[
              Path('AGENTS.md'),
              Path('CURRENT_RUNTIME/TESSERACT_LOCAL_BOOT_CURRENT.md'),
              Path('LOCAL_BRIDGE/bootstrap_once.ps1'),
              Path('LOCAL_BRIDGE/runtime/ggdv-sensorimotor-motor-bridge/README.md'),
              Path('LOCAL_BRIDGE/runtime/ggdv-sensorimotor-motor-bridge/scripts/autostart-sol.ps1'),
              Path('LOCAL_BRIDGE/runtime/ggdv-sensorimotor-motor-bridge/server/runtime_core.py'),
          ]
          offenders=[str(p) for p in paths if stale in p.read_text(encoding='utf-8')]
          assert not offenders, offenders
          PY
      - name: Recovery contract
        run: |
          grep -q 'RECONSTRUCT_FROM_DURABLE_CARRIERS_NOT_CHAT_MEMORY' RECOVERY/recover_continuity.py
          grep -q 'RECOVER_AND_BOOT_G' LOCAL_BRIDGE/bridge.py
